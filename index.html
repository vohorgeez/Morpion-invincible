<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morpion Invincible</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Morpion Invincible</h1>

      <div class="controls">
        <label>
          Difficulté
          <input type="range" id="difficulty" name="difficulty" min="0" max="10" />
          <p>Niveau : <output id="difflevel"></output></p>
        </label>

        <label>
          Départ
          <select id="starter">
            <option value="O" selected>Joueur (O)</option>
            <option value="X">IA (X)</option>
          </select>
        </label>

        <button id="reset">Rejouer</button>

        <label class="toggle" title="Mode sombre">
          <input type="checkbox" id="themeToggle" />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="stats">
        <span>Temps IA : <strong id="aiTime">—</strong> ms</span>
        <span>Nœuds : <strong id="aiNodes">—</strong></span>
      </div>

      <div id="status" class="status">À toi de jouer (O).</div>

      <div id="grid" class="grid" aria-label="Grille de morpion">
        <!-- 9 cases injectées par JS -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
